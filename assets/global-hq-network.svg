<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
  <title id="title">000MAK Global Route and Command HQ</title>
  <desc id="desc">Conceptual four-node collaboration architecture connecting Konya, Sakarya, Istanbul, and Tashkent. Not a claim of active system connectivity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111b31"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c3c67"/><stop offset="1" stop-color="#1d655e"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17243b"/><stop offset="1" stop-color="#101a2c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="370" rx="18" fill="url(#bg)"/>
  <g opacity=".18" stroke="#58749a" stroke-width="1"><path d="M20 40H980M20 80H980M20 120H980M20 160H980M20 200H980M20 240H980M20 280H980M20 320H980"/><path d="M40 20V350M80 20V350M120 20V350M160 20V350M200 20V350M240 20V350M280 20V350M320 20V350M360 20V350M400 20V350M440 20V350M480 20V350M520 20V350M560 20V350M600 20V350M640 20V350M680 20V350M720 20V350M760 20V350M800 20V350M840 20V350M880 20V350M920 20V350M960 20V350"/></g>
  <text x="28" y="32" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#7dd3fc">000MAK / GLOBAL OPERATING MODEL</text>
  <text x="972" y="32" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.2" fill="#94a3b8">CONCEPT ARCHITECTURE</text>
  <rect x="310" y="49" width="380" height="62" rx="13" fill="url(#hub)" stroke="#67e8f9" stroke-opacity=".8" stroke-width="1.4"/>
  <circle cx="337" cy="80" r="8" fill="#34d399" filter="url(#glow)"><animate attributeName="r" values="6;9;6" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="337" cy="80" r="14" fill="none" stroke="#34d399" opacity=".65"><animate attributeName="r" values="10;18;10" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".65;0;.65" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="360" y="75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">GLOBAL ROUTE &amp; COMMAND HQ</text>
  <text x="360" y="94" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#cbd5e1">Policy gate • routing • observability • audit trail</text>
  <g fill="none" stroke="#4b93c4" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"><path d="M500 111V139H125V190"/><path d="M500 139H375V190"/><path d="M500 139H625V190"/><path d="M500 139H875V190"/></g>
  <g fill="#67e8f9" filter="url(#glow)"><circle r="4"><animateMotion dur="3.4s" repeatCount="indefinite" path="M500 111V139H125V190"/></circle><circle r="4"><animateMotion dur="3.7s" repeatCount="indefinite" path="M500 111V139H375V190"/></circle><circle r="4"><animateMotion dur="3.1s" repeatCount="indefinite" path="M500 111V139H625V190"/></circle><circle r="4"><animateMotion dur="3.9s" repeatCount="indefinite" path="M500 111V139H875V190"/></circle></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <g><rect x="25" y="190" width="200" height="103" rx="12" fill="url(#node)" stroke="#38bdf8" stroke-width="1.2"/><rect x="25" y="190" width="200" height="4" rx="2" fill="#38bdf8"/><circle cx="48" cy="217" r="5" fill="#38bdf8"><animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/></circle><text x="62" y="221" font-size="14" font-weight="700" fill="#e0f2fe">KONYA</text><text x="42" y="246" font-size="12" font-weight="700" fill="#7dd3fc">HQ CORE</text><text x="42" y="265" font-size="11" fill="#cbd5e1">Planning &amp; orchestration</text><text x="42" y="281" font-size="10" fill="#94a3b8">Route owner / shared config</text></g>
    <g><rect x="275" y="190" width="200" height="103" rx="12" fill="url(#node)" stroke="#a78bfa" stroke-width="1.2"/><rect x="275" y="190" width="200" height="4" rx="2" fill="#a78bfa"/><circle cx="298" cy="217" r="5" fill="#a78bfa"><animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/></circle><text x="312" y="221" font-size="14" font-weight="700" fill="#ede9fe">SAKARYA</text><text x="292" y="246" font-size="12" font-weight="700" fill="#c4b5fd">ACADEMIC NODE</text><text x="292" y="265" font-size="11" fill="#cbd5e1">MIS research &amp; statistics</text><text x="292" y="281" font-size="10" fill="#94a3b8">Reproducible experiments</text></g>
    <g><rect x="525" y="190" width="200" height="103" rx="12" fill="url(#node)" stroke="#34d399" stroke-width="1.2"/><rect x="525" y="190" width="200" height="4" rx="2" fill="#34d399"/><circle cx="548" cy="217" r="5" fill="#34d399"><animate attributeName="opacity" values=".45;1;.45" dur="1.7s" repeatCount="indefinite"/></circle><text x="562" y="221" font-size="14" font-weight="700" fill="#d1fae5">ISTANBUL</text><text x="542" y="246" font-size="12" font-weight="700" fill="#6ee7b7">CORPORATE HUB</text><text x="542" y="265" font-size="11" fill="#cbd5e1">Data governance &amp; operations</text><text x="542" y="281" font-size="10" fill="#94a3b8">Approved business workflows</text></g>
    <g><rect x="775" y="190" width="200" height="103" rx="12" fill="url(#node)" stroke="#fbbf24" stroke-width="1.2"/><rect x="775" y="190" width="200" height="4" rx="2" fill="#fbbf24"/><circle cx="798" cy="217" r="5" fill="#fbbf24"><animate attributeName="opacity" values=".45;1;.45" dur="2.1s" repeatCount="indefinite"/></circle><text x="812" y="221" font-size="14" font-weight="700" fill="#fef3c7">TASHKENT</text><text x="792" y="246" font-size="12" font-weight="700" fill="#fcd34d">PARTNER NODE</text><text x="792" y="265" font-size="11" fill="#cbd5e1">Azizam coordination</text><text x="792" y="281" font-size="10" fill="#94a3b8">Cross-border collaboration</text></g>
  </g>
  <rect x="25" y="313" width="950" height="35" rx="9" fill="#0b1324" stroke="#334155"/>
  <circle cx="43" cy="330" r="4" fill="#34d399"/><text x="56" y="334" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#cbd5e1">Policy-gated coordination</text><text x="290" y="334" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#94a3b8">• approved data only</text><text x="482" y="334" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#94a3b8">• versioned configurations</text><text x="720" y="334" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#94a3b8">• auditable events</text>
  <text x="500" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#64748b">Conceptual topology — no live connectivity or data sharing is implied.</text>
</svg>