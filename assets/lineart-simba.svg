<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Simba line art">
<style>
.s{fill:none;stroke:#34200f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 2.4s ease forwards var(--d,0s)}
.a{stroke:#ef6a24}
.t{font:300 34px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#34200f;opacity:0;animation:fade 1s ease forwards 2.6s}
.u{font:400 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ef6a24;opacity:0;animation:fade 1s ease forwards 3.1s}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.e{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite 3s}
@media (prefers-color-scheme:dark){.s{stroke:#f3e6d6}.t{fill:#f3e6d6}}
@media (prefers-reduced-motion:reduce){.s{animation:none;stroke-dashoffset:0}.t,.u{animation:none;opacity:1}.e{animation:none}}
</style>
