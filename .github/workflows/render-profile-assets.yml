name: Render profile HQ animations

on:
  push:
    branches:
      - main
    paths:
      - "assets/*.svg"
      - "scripts/render_profile_assets.py"
      - "requirements-profile-assets.txt"
      - ".github/workflows/render-profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-hq-asset-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-profile-assets.txt

      - name: Install system SVG rendering library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2

      - name: Install pinned asset-rendering dependencies
        run: python -m pip install -r requirements-profile-assets.txt

      - name: Render animated GIF exports from SVG sources
        run: python scripts/render_profile_assets.py

      - name: Commit generated animations when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/global-hq-network.gif assets/hq-node-badges.gif
          if git diff --cached --quiet; then
            echo "Generated animations are already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh HQ animation exports"
          # Another profile edit may land while the render job is running.
          # Rebase the generated-assets commit before pushing, never force-push.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying attempt " + "$attempt/3" + "."
            sleep 2
          done
          echo "Could not publish generated animation exports after 3 attempts." >&2
          exit 1
